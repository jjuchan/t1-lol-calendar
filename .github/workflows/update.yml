name: Update T1 Calendar

on:
  schedule:
    # 30분 간격 (UTC 기준). 필요하면 자유롭게 조정하세요.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# 크론과 수동 실행이 겹쳐 두 워크플로우가 동시에 public/t1.ics를 커밋/배포하지 않도록 직렬화한다.
concurrency:
  group: t1-calendar-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check & compile
        run: npm run build

      - name: Fetch latest schedule and regenerate t1.ics
        run: npm run generate

      - name: Commit updated t1.ics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/t1.ics
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋을 건너뜁니다."
          else
            git commit -m "chore: update t1.ics [skip ci]"
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
